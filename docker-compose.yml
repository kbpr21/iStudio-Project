services:
  # Apache Tomcat 10.1 Application Server on port 8081
  tomcat:
    image: tomcat:10.1-jdk17-temurin
    container_name: devops-tomcat-server
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./target/student-feedback-portal.war:/usr/local/tomcat/webapps/student-feedback-portal.war:ro
      - tomcat_logs:/usr/local/tomcat/logs
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - devops-net

  # Jenkins CI/CD Controller on port 8080
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: devops-jenkins-server
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true
    networks:
      - devops-net

volumes:
  jenkins_home:
  tomcat_logs:

networks:
  devops-net:
    driver: bridge
